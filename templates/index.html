{% extends 'layout.html' %} {% block content %}
<h1>Login</h1>
<form action="/" method="post" class="box">
  <!--FIX=CSRF token prevents forged form submissions from external sites-->
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <div class="input__wrapper">
    <input
      type="text"
      name="username"
      id="username"
      placeholder="Username"
      class="input__field"
      required
    />
  </div>
  <div class="input__wrapper">
    <input
      type="password"
      name="password"
      id="password"
      placeholder="Password"
      class="input__field"
      required
    />
  </div>
  <div class="input__wrapper">
    <input type="submit" class="btn" value="Log In" />
  </div>
</form>
<!-- User message -->
{% if msg %}
<!--Allowed any HTML or script passed through the msg parameter to run in the browser.
FIX = Remove |safe filter
Without |safe Jinja2 escapes all output as plain text by default-->
<div>{{ msg }}</div>
{% endif %}
{% endblock %}
